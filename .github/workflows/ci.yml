name: CI

# Lint, tests y build en cada PR y en cada push a main.
# El deploy lo hace la integración Git del hosting a partir de main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    env:
      SESSION_SECRET: ci-only-session-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
