name: Oxygen · CI & Deploy

# CI (lint + build) en cada PR hacia main.
# Deploy a Oxygen (producción) en cada push/merge a main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

# Un deploy a la vez; cancela CI de PR obsoletos.
concurrency:
  group: oxygen-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to Oxygen
    needs: ci
    # Solo en push/merge a main, nunca en PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - name: Build & publish to Oxygen
        run: npx shopify hydrogen deploy
        env:
          # Token inyectado por la integración nativa Shopify ↔ GitHub
          # (Hydrogen → Repositorio Git). El sufijo es el ID del storefront.
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000147614 }}
